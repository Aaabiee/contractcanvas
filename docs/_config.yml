title: ContractCanvas
description: Developer documentation for the ContractCanvas CLM platform
baseurl: /contractcanvas
url: https://aaabiee.github.io

remote_theme: just-the-docs/just-the-docs@v0.10.1

markdown: kramdown
highlighter: rouge

color_scheme: dark

# Enable per-page table of contents on the right
heading_anchors: true

nav_enabled: true

# Back to top link
back_to_top: true
back_to_top_text: Back to top

# Footer
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/Aaabiee/contractcanvas
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Aux links (top-right)
aux_links:
  GitHub: https://github.com/Aaabiee/contractcanvas

aux_links_new_tab: true

# Enable search
search_enabled: true
search:
  heading_level: 3
  previews: 3

# Callouts
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
