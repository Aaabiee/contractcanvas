title: ContractCanvas
description: Developer documentation for the ContractCanvas CLM platform
baseurl: /contractcanvas
url: https://aaabiee.github.io

remote_theme: rundocs/jekyll-rtd-theme@2.0.10

markdown: kramdown
highlighter: rouge

readme_index:
  with_hierarchies: true

# Sidebar table of contents depth
toc:
  selectors: "h2,h3"

# Footer
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/Aaabiee/contractcanvas
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Search
search_enabled: true

plugins:
  - jemoji
  - jekyll-avatar

exclude:
  - Gemfile
  - Gemfile.lock
