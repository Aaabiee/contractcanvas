name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ───────────────────────────── API ─────────────────────────────
  api-lint-test:
    name: API — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: apps/api
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-minimum-32-chars!!

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/

  api-build:
    name: API — Build TypeScript
    runs-on: ubuntu-latest
    needs: api-lint-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run build:ci
        working-directory: apps/api

  # ───────────────────────────── Web ─────────────────────────────
  web-lint-test:
    name: Web — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx jest --watchAll=false --ci --coverage --passWithNoTests
        working-directory: apps/web
        env:
          CI: true

      - name: Upload Web coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/

  web-build:
    name: Web — Build Production Bundle
    runs-on: ubuntu-latest
    needs: web-lint-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run -w web build -- --configuration=production

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  # ─────────────── E2E Tests (Playwright) ───────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [api-build, web-build]
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: contractcanvas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/contractcanvas_test
      - run: npx prisma db push --schema prisma/schema.prisma --skip-generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/contractcanvas_test
      - run: npx playwright install chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/contractcanvas_test
          JWT_SECRET: ci-test-secret-key-minimum-32-chars!!
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # ─────────────── Docker build verification ───────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [api-build, web-build]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: contractcanvas-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: contractcanvas-web:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
