name: Deploy — Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  REGISTRY:    ghcr.io
  IMAGE_API:   ghcr.io/${{ github.repository }}/api
  IMAGE_WEB:   ghcr.io/${{ github.repository }}/web
  ENVIRONMENT: dev

jobs:
  deploy-dev:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:dev
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:dev
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          build-args: |
            API_URL=${{ vars.DEV_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Deploy via SSH ──────────────────────────────────────────
      - name: Deploy to Dev server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key:      ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/contractcanvas

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_API }}:dev
            docker pull ${{ env.IMAGE_WEB }}:dev

            # Write .env
            cat > infra/.env <<'EOF'
            NODE_ENV=development
            POSTGRES_USER=${{ secrets.DEV_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.DEV_POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.DEV_POSTGRES_DB }}
            POSTGRES_PORT=5432
            JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            FRONTEND_URL=${{ vars.DEV_URL }}
            S3_ACCESS_KEY=${{ secrets.DEV_S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.DEV_S3_SECRET_KEY }}
            S3_BUCKET=contractcanvas-dev
            EOF

            # Apply DB migrations
            docker run --rm --network contractcanvas_default \
              -e DATABASE_URL="postgresql://${{ secrets.DEV_POSTGRES_USER }}:${{ secrets.DEV_POSTGRES_PASSWORD }}@db:5432/${{ secrets.DEV_POSTGRES_DB }}" \
              ${{ env.IMAGE_API }}:dev \
              node -e "require('./apps/api/dist/server.js')" || true

            # Restart services
            IMAGE_API=${{ env.IMAGE_API }}:dev \
            IMAGE_WEB=${{ env.IMAGE_WEB }}:dev \
            docker compose -f infra/docker-compose.yml --profile full --env-file infra/.env up -d --force-recreate

            echo "✅ Dev deployment complete"

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Dev deployment status: $STATUS (SHA: ${{ github.sha }})"
