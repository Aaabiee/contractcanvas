name: Secret Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run secret scanner on diff
        run: npx tsx scripts/scan-secrets.ts

      - name: Check for .env files in tracked files
        run: |
          ENVFILES=$(git ls-files | grep -iE '\.env$|\.env\.' | grep -v '.env.example' || true)
          if [ -n "$ENVFILES" ]; then
            echo "ERROR: .env files found in tracked files:"
            echo "$ENVFILES"
            exit 1
          fi
          echo "No .env files tracked."

      - name: Check for private keys in tracked files
        run: |
          KEYFILES=$(git ls-files | grep -iE '\.pem$|\.key$|\.p12$|\.pfx$' || true)
          if [ -n "$KEYFILES" ]; then
            echo "ERROR: Private key files found in tracked files:"
            echo "$KEYFILES"
            exit 1
          fi
          echo "No private key files tracked."
