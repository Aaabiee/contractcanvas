name: Deploy — Production

on:
  # Only deploy to prod from a manually-approved release tag
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to promote to production'
        required: true
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # Never cancel an in-flight prod deploy

env:
  REGISTRY:  ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  guard:
    name: Confirm deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Confirmation not received. Aborting."
            exit 1
          fi

  deploy-prod:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    needs: guard
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag as :latest and :<version> for production
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build & push API image (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push Web image (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.version.outputs.VERSION }}
          build-args: |
            API_URL=${{ vars.PROD_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/contractcanvas

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_API }}:latest
            docker pull ${{ env.IMAGE_WEB }}:latest

            # Create backup tag of current production images before swap
            PREV=$(docker inspect --format='{{.Id}}' contractcanvas-api 2>/dev/null || echo none)
            echo "Previous API image: $PREV"

            cat > infra/.env <<'EOF'
            NODE_ENV=production
            POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
            POSTGRES_PORT=5432
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            FRONTEND_URL=${{ vars.PROD_URL }}
            S3_ACCESS_KEY=${{ secrets.PROD_S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.PROD_S3_SECRET_KEY }}
            S3_BUCKET=contractcanvas-prod
            STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
            EOF

            IMAGE_API=${{ env.IMAGE_API }}:latest \
            IMAGE_WEB=${{ env.IMAGE_WEB }}:latest \
            docker compose -f infra/docker-compose.yml --profile prod --env-file infra/.env up -d --force-recreate

            # Post-deploy health check
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3333/health || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check failed (got $STATUS) — manual rollback may be needed"
              exit 1
            fi
            echo "✅ Production deployment healthy (version: ${{ steps.version.outputs.VERSION }})"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:    ${{ github.ref_name }}
          release_name: ContractCanvas ${{ github.ref_name }}
          body: |
            ## ContractCanvas ${{ github.ref_name }}

            Deployed to production at ${{ vars.PROD_URL }}

            ### Changes
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
          draft:      false
          prerelease: false
