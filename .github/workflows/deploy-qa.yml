name: Deploy — QA

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to deploy (leave blank for HEAD)'
        required: false

concurrency:
  group: deploy-qa
  cancel-in-progress: true

env:
  REGISTRY:  ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  deploy-qa:
    name: Build & Deploy to QA
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: ${{ vars.QA_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image (qa tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:qa
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push Web image (qa tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:qa
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          build-args: |
            API_URL=${{ vars.QA_API_URL }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Run smoke tests against QA
        run: |
          # Wait for the QA environment to be live before testing
          echo "Running API smoke test against ${{ vars.QA_API_URL }}/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.QA_API_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ QA API healthy (attempt $i)"
              break
            fi
            echo "Attempt $i: got $STATUS — waiting 10s..."
            sleep 10
          done

      - name: Deploy to QA server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USER }}
          key:      ${{ secrets.QA_SSH_KEY }}
          script: |
            set -e
            cd /opt/contractcanvas

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_API }}:qa
            docker pull ${{ env.IMAGE_WEB }}:qa

            cat > infra/.env <<'EOF'
            NODE_ENV=staging
            POSTGRES_USER=${{ secrets.QA_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.QA_POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.QA_POSTGRES_DB }}
            POSTGRES_PORT=5432
            JWT_SECRET=${{ secrets.QA_JWT_SECRET }}
            FRONTEND_URL=${{ vars.QA_URL }}
            S3_ACCESS_KEY=${{ secrets.QA_S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.QA_S3_SECRET_KEY }}
            S3_BUCKET=contractcanvas-qa
            STRIPE_SECRET_KEY=${{ secrets.QA_STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.QA_STRIPE_WEBHOOK_SECRET }}
            EOF

            IMAGE_API=${{ env.IMAGE_API }}:qa \
            IMAGE_WEB=${{ env.IMAGE_WEB }}:qa \
            docker compose -f infra/docker-compose.yml --profile qa --env-file infra/.env up -d --force-recreate

            echo "✅ QA deployment complete"
