server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Security headers (OWASP A05 Security Misconfiguration) ────────────────
    #
    # CSP for the Angular SPA.  Stripe.js requires:
    #   script-src  https://js.stripe.com
    #   connect-src https://api.stripe.com
    #   frame-src   https://js.stripe.com  (3DS / payment element iframe)
    # Angular Material uses inline styles so 'unsafe-inline' is required for
    # style-src until a CSP-nonce-based build is adopted.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' https://js.stripe.com; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob: https:; \
         font-src 'self'; \
         connect-src 'self' https://api.stripe.com; \
         frame-src https://js.stripe.com; \
         frame-ancestors 'none'; \
         object-src 'none'; \
         base-uri 'self'; \
         form-action 'self';"
        always;

    # HSTS — 1 year, eligible for browser preload list (OWASP A02 / A05)
    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains; preload"
        always;

    # Prevent browser from inferring MIME types (OWASP A05)
    add_header X-Content-Type-Options  "nosniff"                     always;

    # Clickjacking protection (OWASP A01) — also covered by CSP frame-ancestors
    add_header X-Frame-Options         "DENY"                        always;

    # Limit information sent in Referer header
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Disable browser features not needed by this app (OWASP A05)
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()"
        always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers — nginx add_header is not inherited
        # inside nested location blocks that themselves call add_header.
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY"    always;
        try_files $uri =404;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://api:3333/health;
    }
}
