<div class="landing">
  <!-- Full-width hero banner -->
  <div class="hero">
    <img src="hero-banner.svg" alt="ContractCanvas — Legal workflow, simplified" class="hero-img" />
  </div>

  <!-- Login card overlaps the banner bottom -->
  <div class="card-wrapper">
    <mat-card class="login-card">
      <mat-card-content>
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input
              matInput
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="you@example.com"
              required
              email>
            <mat-icon matPrefix>alternate_email</mat-icon>
            <mat-error *ngIf="loginForm.controls['email']?.hasError('email')">
              Please enter a valid email address
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Password"
              required>
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Toggle password'" [attr.aria-pressed]="hidePassword" type="button">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.controls['password']?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <div class="options-row">
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>

          <div *ngIf="errorMessage" class="error-toast">{{ errorMessage }}</div>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width sign-in-btn"
            [disabled]="!loginForm.form.valid">
            Sign In
          </button>
        </form>
      </mat-card-content>
    </mat-card>

    <p class="register-prompt">
      No account? <a routerLink="/register" class="register-link">Create one</a>
    </p>
  </div>
</div>
