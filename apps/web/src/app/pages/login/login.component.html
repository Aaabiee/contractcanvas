<!-- apps/web/src/app/pages/login/login.component.html -->

<div class="login-wrapper">

  <mat-card class="login-card">
    <mat-card-header>
      <div class="logo-container">
        <img src="logo.svg" alt="ContractCanvas" class="logo-img" width="200" height="48" />
      </div>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">

        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input 
            matInput 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="you@example.com"
            required
            email>
          <mat-icon matPrefix>alternate_email</mat-icon>
          <mat-error *ngIf="loginForm.controls['email']?.hasError('email')">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input 
            matInput 
            [type]="hidePassword ? 'password' : 'text'" 
            id="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Password"
            required>
          <mat-icon matPrefix>lock</mat-icon>
          
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.controls['password']?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <!-- Forgot Password Link -->
        <div class="options-container">
          <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="login-error-message">
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          class="full-width login-button"
          [disabled]="!loginForm.form.valid">
          Sign In
        </button>

      </form>
    </mat-card-content>
  </mat-card>

  <!-- Secondary action: Register link, placed outside the card -->
  <div class="register-link-container">
    No account? <a routerLink="/register" class="register-link">Create one</a>
  </div>

</div>
