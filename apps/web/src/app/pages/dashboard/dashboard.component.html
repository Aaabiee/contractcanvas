<mat-sidenav-container class="dash-container">
  <mat-sidenav
    #snav
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="!(isHandset$ | async)"
  >
    <div class="sidenav-header">
      <mat-icon>gavel</mat-icon>
      <span class="brand">ContractCanvas</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>space_dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/matters" routerLinkActive="active">
        <mat-icon matListItemIcon>work</mat-icon>
        <span matListItemTitle>Matters</span>
      </a>
      <a mat-list-item routerLink="/contracts" routerLinkActive="active">
        <mat-icon matListItemIcon>description</mat-icon>
        <span matListItemTitle>Contracts</span>
      </a>
      <a mat-list-item routerLink="/tasks" routerLinkActive="active">
        <mat-icon matListItemIcon>task_alt</mat-icon>
        <span matListItemTitle>Tasks</span>
      </a>
      <a mat-list-item routerLink="/documents" routerLinkActive="active">
        <mat-icon matListItemIcon>cloud_upload</mat-icon>
        <span matListItemTitle>Documents</span>
      </a>
      <a mat-list-item routerLink="/analytics" routerLinkActive="active">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Analytics</span>
      </a>
      <a mat-list-item routerLink="/billing" routerLinkActive="active">
        <mat-icon matListItemIcon>credit_card</mat-icon>
        <span matListItemTitle>Billing</span>
      </a>
      <a *ngIf="canSeeAdmin()" mat-list-item routerLink="/admin" routerLinkActive="active">
        <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
        <span matListItemTitle>Admin</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <button type="button" mat-icon-button (click)="snav.toggle()" class="menu-btn" aria-label="Toggle sidenav">
        <mat-icon>menu</mat-icon>
      </button>
      <form (ngSubmit)="onSearch()" class="search-form">
        <input
          class="search-input"
          type="search"
          placeholder="Search matters, contracts…"
          [(ngModel)]="searchQuery"
          name="searchQuery"
          aria-label="Global search"
        />
        <button type="submit" mat-icon-button aria-label="Submit search">
          <mat-icon>search</mat-icon>
        </button>
      </form>
      <span class="flex-1"></span>
      <button mat-icon-button (click)="toggleTheme(!themeDark())" [matTooltip]="themeDark() ? 'Switch to light mode' : 'Switch to dark mode'" aria-label="Toggle theme">
        <mat-icon>{{ themeDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Open user menu" matTooltip="Account">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>person</mat-icon>
          <span>{{ displayName() || 'Account' }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/settings/profile">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
