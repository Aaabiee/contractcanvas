<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" role="img" aria-label="ContractCanvas logo">
  <title>ContractCanvas</title>
  <!-- Shield/document icon -->
  <g transform="translate(4, 4)">
    <!-- Document body -->
    <rect x="6" y="0" width="32" height="44" rx="4" fill="#1976d2"/>
    <!-- Folded corner -->
    <path d="M26 0 L38 12 H30 C27.79 12 26 10.21 26 8 Z" fill="#1565c0"/>
    <!-- Contract lines -->
    <line x1="14" y1="20" x2="30" y2="20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="26" x2="26" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="14" y1="32" x2="28" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Signature flourish -->
    <path d="M16 38 Q20 34 24 38 Q28 42 32 36" stroke="#64b5f6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">
    Contract<tspan fill="#1976d2">Canvas</tspan>
  </text>
  <!-- Tagline (optional, hidden at small sizes) -->
  <text x="56" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#888" letter-spacing="0.3">
    Legal workflow, simplified
  </text>
</svg>
