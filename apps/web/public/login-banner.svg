<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" fill="none" role="img" aria-label="ContractCanvas">
  <title>ContractCanvas</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <linearGradient id="doc-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="140" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Decorative faint document shapes (background pattern) -->
  <g opacity="0.08">
    <rect x="20" y="-10" width="50" height="66" rx="4" fill="#fff" transform="rotate(12 45 23)"/>
    <rect x="330" y="60" width="50" height="66" rx="4" fill="#fff" transform="rotate(-8 355 93)"/>
    <rect x="280" y="-20" width="40" height="52" rx="3" fill="#fff" transform="rotate(6 300 6)"/>
    <rect x="60" y="90" width="44" height="58" rx="3" fill="#fff" transform="rotate(-5 82 119)"/>
  </g>

  <!-- Central document icon -->
  <g transform="translate(140, 24)">
    <!-- Document body -->
    <rect x="0" y="0" width="40" height="52" rx="5" fill="url(#doc-fill)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Folded corner -->
    <path d="M26 0 L40 14 H30 C27.24 14 26 12.76 26 10 Z" fill="rgba(255,255,255,0.2)"/>
    <!-- Lines -->
    <line x1="10" y1="24" x2="28" y2="24" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="31" x2="24" y2="31" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="38" x2="26" y2="38" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <!-- Signature -->
    <path d="M12 44 Q16 40 20 44 Q24 48 28 42" stroke="#64b5f6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
    Contract<tspan fill="#90caf9">Canvas</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="125" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">
    Legal workflow, simplified
  </text>
</svg>
