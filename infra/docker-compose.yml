# infra/docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-contractcanvas-postgres}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: contractcanvas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Automatically creates the S3 bucket on first startup
  minio-init:
    image: minio/mc:latest
    container_name: contractcanvas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET:-contractcanvas};
        mc anonymous set none local/${S3_BUCKET:-contractcanvas};
        echo 'MinIO bucket ready.';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET:     ${S3_BUCKET:-contractcanvas}

  redis:
    image: redis:7-alpine
    container_name: contractcanvas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API service (production/staging only — override with profiles)
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: contractcanvas-api
    restart: unless-stopped
    profiles: ["full", "prod", "staging", "qa"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:      ${NODE_ENV:-production}
      PORT:          3333
      DATABASE_URL:  postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET:    ${JWT_SECRET}
      FRONTEND_URL:  ${FRONTEND_URL:-http://localhost}
      S3_ENDPOINT:   http://minio:9000
      S3_REGION:     ${S3_REGION:-us-east-1}
      S3_BUCKET:     ${S3_BUCKET:-contractcanvas}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      REDIS_URL:              redis://redis:6379
    ports:
      - "${API_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Web service (production/staging only)
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: ${API_URL:-http://api:3333}
    container_name: contractcanvas-web
    restart: unless-stopped
    profiles: ["full", "prod", "staging", "qa"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:    {}
  miniodata: {}
  redisdata: {}
